server {
    listen 80;
    server_name _;
    root /var/www/spa;
    index index.html;

    client_max_body_size 20M;

    # API Laravel. Nenhum outro PHP e executado.
    location ~ ^/(api|up)(/|$) {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        fastcgi_hide_header X-Powered-By;
    }

    # Fotos dos animais (disco public). Comprovantes ficam em storage/app/private.
    location ^~ /storage/ {
        alias /var/www/storage/app/public/;
        expires 7d;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    # Rotas do painel Vue. O index.html nao vai para o cache: ele aponta para os assets do deploy atual.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
